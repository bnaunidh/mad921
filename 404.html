<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{ --bg:#fff; --ink:#202124; --muted:#5f6368; --line:#dadce0 }
  @media (prefers-color-scheme: dark){ :root{ --bg:#111418; --ink:#e8eaed; --muted:#9aa0a6; --line:#2d3135 } }
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);display:grid;place-items:center;padding:24px;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .b{max-width:420px;text-align:center}
  .c{font-size:54px;font-weight:300;letter-spacing:-.03em;line-height:1;color:var(--muted)}
  h1{font-size:17px;font-weight:600;margin:16px 0 6px}
  p{font-size:13.5px;color:var(--muted);line-height:1.6;margin:0}
  hr{border:0;border-top:1px solid var(--line);margin:22px 0}
  .s{font-size:12px;color:var(--muted)}
</style>
<div class="b">
  <div class="c">404</div>
  <h1>There is nothing at this address</h1>
  <p>The page you requested does not exist.</p>
  <hr>
  <p class="s">Check the address, or go back to wherever you followed the link from.</p>
</div>
